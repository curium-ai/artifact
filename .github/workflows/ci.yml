name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/artifact-runtime.db
      ARTIFACT_AUTH_MODE: google
      GOOGLE_CLIENT_ID: synthetic
      GOOGLE_CLIENT_SECRET: synthetic
      ARTIFACT_MCP_BASE_URL: http://localhost:8000/mcp
      ARTIFACT_ALLOWED_DOMAIN: example.test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv /tmp/artifact-runtime
      - run: /tmp/artifact-runtime/bin/pip install -r backend/requirements.txt
      - run: /tmp/artifact-runtime/bin/alembic -c backend/alembic.ini upgrade head
      - run: /tmp/artifact-runtime/bin/python -c "import main"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: artifact
          POSTGRES_PASSWORD: artifact-test
          POSTGRES_DB: artifact_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artifact -d artifact_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://artifact:artifact-test@localhost:5432/artifact_test
      ARTIFACT_TEST_DATABASE_URL: postgresql+psycopg://artifact:artifact-test@localhost:5432/artifact_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: alembic -c backend/alembic.ini downgrade base
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: pytest backend/tests
