services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: artifact
      POSTGRES_USER: artifact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artifact-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artifact -d artifact"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://artifact:artifact-local@postgres:5432/artifact}
    depends_on:
      postgres:
        condition: service_healthy
  artifact:
    build: .
    ports:
      - "3000:8000"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://artifact:artifact-local@postgres:5432/artifact}
      - ARTIFACT_PASSWORD=${ARTIFACT_PASSWORD:-artifact}
      - ARTIFACT_UPLOAD_DIR=/data
      - ARTIFACT_PUBLIC_URL=${ARTIFACT_PUBLIC_URL:-http://localhost:3000}
      - ARTIFACT_MAX_FILE_BYTES=${ARTIFACT_MAX_FILE_BYTES:-104857600}
      - ARTIFACT_AUTH_MODE=${ARTIFACT_AUTH_MODE:-password}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - ARTIFACT_ALLOWED_DOMAIN=${ARTIFACT_ALLOWED_DOMAIN:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ARTIFACT_MCP_BASE_URL=${ARTIFACT_MCP_BASE_URL:-http://localhost:3000/mcp}
      - ARTIFACT_MCP_TOKEN=${ARTIFACT_MCP_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres-data:
